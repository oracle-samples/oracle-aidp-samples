[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-aidp-migrator"
dynamic = ["version"]
description = "AWS data-stack → Oracle AIDP migrator (S3, Glue, Athena, EMR, SageMaker)"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
oci = ["oci>=2.140", "requests>=2.31"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.2,<2; python_version >= '3.10'"]

[project.scripts]
aws-aidp = "aws_aidp.cli:main"
aws-aidp-mcp = "aws_aidp.mcp_server:main"

[tool.setuptools.packages.find]
include = ["aws_aidp*"]

[tool.setuptools.package-data]
"aws_aidp.fixtures" = ["*.json"]

[tool.setuptools.dynamic]
version = { attr = "aws_aidp.__version__" }
