# ============================================================================
#  AIDP Migrator — DEFAULT CONFIGURATION TEMPLATE
# ============================================================================
#
# This file is the CANONICAL TEMPLATE. Every field is documented below.
# Do NOT edit this file with real customer values — instead:
#
#   1. Copy it to one of:
#        ./aidp_migrator.yaml              (in your working directory)
#        ~/aidp_migrator.yaml              (your home directory)
#        <customer>_aidp_migrator.yaml     (any *_aidp_migrator.yaml name;
#                                           gitignored by convention)
#   2. Fill in every `<placeholder>` with a real value.
#   3. Run the tool — discovery order:  --config <path>  >  $AIDP_CONFIG_PATH
#                                       >  ./aidp_migrator.yaml
#                                       >  ~/aidp_migrator.yaml
#
# Validation:
#   The loader validates this file against aidp_config/schema.json on load.
#   Typos, missing required fields, or bad values fail loudly with a pointer
#   to the offending path.
#
# ============================================================================


# ─── AIDP infrastructure (REQUIRED) ─────────────────────────────────────────
# Every field here is required — the schema rejects a config without them.

aidp:
  # OCI region the AIDP workspace runs in. Examples:
  #   ap-mumbai-1, us-phoenix-1, us-ashburn-1, ap-hyderabad-1, ap-singapore-1
  # Used to construct the AIDP REST endpoint (`aidp.<region>.oci.oraclecloud.com`).
  region: <region>

  # AIDP data-lake OCID — find it in the OCI Console under
  #   Analytics & AI → AI → Data Platform → Data Lakes.
  # Format: ocid1.aidataplatform.oc1.<region>.<hash>
  lake_ocid: <ocid1.aidataplatform...>

  # AIDP workspace UUID — from the AIDP console URL when the workspace is open.
  # Format: standard 8-4-4-4-12 UUID.
  workspace_id: <uuid>

  # OCI CLI profile name in ~/.oci/config used for API-key auth. This is the
  # bracketed section header, e.g. [DEFAULT] or [CUSTOMER]. AIDP calls (create
  # cluster, install libraries, put_object, etc.) are signed with this profile.
  oci_profile: DEFAULT

  # Fallback OCI namespace used ONLY when a bucket is absent from the
  # bucket-mapping CSV (see `bucket_mapping.path` below). Per-bucket namespaces
  # come from that CSV (authoritative source); this default is the safety net.
  # Typically your workspace tenancy's namespace.
  default_namespace: <workspace-namespace>

  # ─── OCI credentials for CLUSTER-SIDE operations (OPTIONAL) ──────────────
  # Fetched at each OCI call inside migrated notebooks and by aidp_compat via
  # aidputils.secrets.get(name, key=...). The AIDP Credential Store credential
  # must contain 5 keys (one per OCI Signer field): user, fingerprint, tenancy,
  # region, and the raw PEM contents. Cluster-side never reads a config file.
  #
  # Required when migrated Python code creates an OCI client. The migrator
  # carries these references (not secret values) into both the conversion
  # kernel and saved notebook, so standalone workflows use the same identity.
  # Missing configuration fails rather than selecting a default credential.
  # After changing these references, regenerate the affected notebooks.
  #
  # LHS = OCI Signer field name (fixed by the OCI SDK).
  # RHS = key name inside the AIDP Credential Store credential (rename in
  #       AIDP UI without a code change; only edit RHS here).
  # oci_credentials:
  #   from: aidp_credential_store
  #   name: <credential-name-in-aidp>
  #   keys:
  #     user: user
  #     fingerprint: fingerprint
  #     tenancy: tenancy
  #     region: region
  #     private_key_content: key_file_content

  # ── FOR SCALA ONLY / TEMPORARY — remove after AIDP 5.0 (Scala aidputils not available until then) ──
  # Cluster path to an OCI API-key config file used by the injected %scala
  # OciFs helper (com.oracle.bmc.auth.ConfigFileAuthenticationDetailsProvider).
  # PySpark cells fetch OCI signer keys from AIDP Credential Store via
  # aidputils.secrets and do NOT read this. Set only if the notebooks use
  # %scala + dbutils.fs.ls / entity_decrypt. Env override: OCI_CONFIG_FILE.
  # scala_oci_config_path: /Workspace/<team>/oci-config/config


# ─── Output paths (REQUIRED) ────────────────────────────────────────────────
# Both paths must start with /Workspace/ (schema enforces).

paths:
  # Where the migration tool writes migrated notebooks + task reports.
  # Structure under it:
  #   {migrate_output}/{job_name}/notebooks/  ← migrated .ipynb files
  #   {migrate_output}/{job_name}/tasks/      ← per-task reports + final.ipynb
  #   {migrate_output}/{job_name}/deps/       ← dep migration artifacts
  #   {migrate_output}/{job_name}/reports/    ← job-level reports
  migrate_output: /Workspace/<your-slug>/aidp-migration-tool-output

  # Where dbx_export writes RAW notebooks exported from Databricks (before
  # migration touches them). Consumed by scripts/job_migrate.py's %run
  # resolution and by scripts/build_dag_from_workflow.py.
  export_output: /Workspace/<your-slug>/ai_dbx_exported

  # Shared AIDP dependency repository for ALL migration artifacts — JARs AND
  # wheels (incl. the aidp_compat wheel). Checked FIRST for every dependency:
  # if the same-named artifact is already here (exact version, else the highest
  # available version) it is reused, and Databricks/proxy is fetched only when
  # it is absent. (Deprecated aliases, still read if this key is absent:
  # lib_fallback_dir, then jar_fallback_dir.)
  lib_repository_dir: /Workspace/migration-dependencies/libs/

  # Optional reviewed baseline installed on target workload clusters. Leave
  # commented to use config/target_runtime_requirements.txt from this checkout.
  # target_runtime_requirements_file: config/target_runtime_requirements.txt

  # Optional package compatibility matrix used while building each cluster's
  # consolidated requirements file. Leave commented to use the repository
  # default. Env override: AIDP_COMPATIBILITY_POLICY_FILE.
  # compatibility_policy_file: config/aidp_compatibility_policy.yaml


# ─── Bucket / storage mapping (REQUIRED) ────────────────────────────────────

bucket_mapping:
  # Path to a 3-column CSV:  s3_bucket, oci_bucket, oci_namespace.
  # This is the AUTHORITATIVE source for S3 → OCI path translation. Every
  # bucket the migration tool touches must appear here. For customers where
  # s3_bucket == oci_bucket, still list them (with matching values in both
  # columns). Consumed by scripts/context_tools.py.
  #
  # The loader fails fast at startup if the file at this path does not exist
  # (see aidp_config/loader.py::_check_referenced_files_exist) — otherwise
  # every S3→OCI lookup would silently fall back to fuzzy matching.
  path: config/<customer>_bucket_map.csv


# ─── Customization pack (OPTIONAL) ──────────────────────────────────────────
# For notebooks whose AIDP conversion CANNOT be produced by the deterministic
# rewriters or the LLM — an injected business map (per-table Delta version pin),
# a new capability (time-travel reads), a non-mechanical SDK swap, or a
# tenancy/namespace path convention. The customer keeps a pre-converted "golden"
# notebook in a pack; the migrator swaps it in BEFORE analysis, then still runs
# execute + verify + fix on it (so drift is repaired or fails loudly, never
# shipped blind). Omit this block entirely if the customer has no such notebooks.
#
# `path` points at a pack directory (relative to repo root, like bucket_mapping):
#     customer_packs/<customer>/
#       overrides.yaml     (registry — matched by notebook basename)
#       notebooks/         (the golden pre-converted notebooks)
# Full authoring guide + schema: scripts/customization_pack.py module docstring
# customizations:
#   path: customer_packs/<customer>

# ─── Databricks source (REQUIRED) ───────────────────────────────────────────
# Exactly ONE of `host` or `proxy` is required (mutually exclusive at CLI too).
# The tool needs to reach Databricks to pull raw notebooks; how it reaches
# there depends on the customer's network topology.

dbx_source:
  # OPTION 1 — direct DBX workspace URL. Use when the migrator machine can
  # reach Databricks over the public internet. Requires a DBX personal access
  # token supplied via env var (never in this file):
  #         export DATABRICKS_TOKEN="dapi..."
  host: https://<customer>.cloud.databricks.com

  # OPTION 2 — OCI-side proxy host:port. Use when direct Databricks access
  # from the OCI VNIC is not permitted (network-level trust; no DBX token
  # required). Format: <hostname>:<port>  (no scheme). Comment OUT the `host`
  # line above and uncomment the line below.
  # proxy: <hostname>:<port>

  # OPTIONAL — max attempts (1–20; default 10) for a GitHub-via-proxy notebook
  # read on a transient 429/5xx. The proxy is customer-controlled and rate-limits
  # (nginx 429) once many developers export concurrently; raise this to ride out
  # bursts. Honors the server's Retry-After. Omit to use the default of 20.
  # proxy_max_retries: 20


# ─── Secrets (REQUIRED section; individual fields OPTIONAL) ─────────────────
# Each secret field accepts EITHER:
#   (a) a plaintext string   — DISCOURAGED; interim only. Do NOT commit.
#   (b) a credential-store reference — RECOMMENDED. Fetched at cluster runtime
#       via aidputils.secrets.get(name, key=...). Laptop-side loader does not
#       fetch these; they are consumed inside migrated notebooks.
#       EXCEPTION: secrets.mlflow_tracking_uri is ALSO resolved at cluster-CREATE
#       (on-cluster, via aidputils) and materialized into the new cluster's
#       sparkEnvVariables, so every task inherits MLFLOW_TRACKING_URI uniformly.
#       The resolved URI is therefore stored in the cluster resource — a
#       deliberate, accepted trade-off for uniform coverage; rotate the
#       credential per issue #50.
#
# `secrets: {}` is valid — if the customer doesn't use MLflow or entity-crypto, omit
# the fields. To FAIL LOUDLY on absence, list them in `assert_present` below.

secrets:
  # ─── MLflow tracking URI (optional — only if the customer uses MLflow) ────
  # Credential-store form (RECOMMENDED):
  # mlflow_tracking_uri:
  #   from: aidp_credential_store
  #   name: <credential-name-in-aidp>       # e.g. migration_tool_secrets
  #   key:  <key-name-inside-credential>    # e.g. mlflow-tracking-uri
  #
  # Plaintext form (DISCOURAGED — interim only):
  # mlflow_tracking_uri: "https://<user>:<password>@<mlflow-host>"

  # ─── entity-crypto assumed-role ARN (optional — only if entity_decrypt UDF used) ─
  # AWS STS assumed-role ARN required by the entity-crypto JVM UDF (entity_decrypt /
  # entity_encrypt). Omit if the customer's notebooks don't call entity_decrypt.
  # Credential-store form (RECOMMENDED):
  # entity_crypto_arn:
  #   from: aidp_credential_store
  #   name: <credential-name-in-aidp>       # e.g. migration_tool_secrets
  #   key:  <key-name-inside-credential>    # e.g. entity_crypto-arn
  #
  # Plaintext form (DISCOURAGED — interim only):
  # entity_crypto_arn: "arn:aws:sts::<acct>:assumed-role/<role>/<session>"
  # REQUIRED with entity_crypto_arn: your decrypt JAR's registrar class
  # (the class whose registerUdf(spark) registers entity_decrypt/encrypt).
  # entity_crypto_registrar: "com.example.dp.UdfRegistrar"

  # ─── DBX proxy basic auth (optional — only if the proxy front enforces it) ─
  # Some deployments front the Databricks proxy with nginx requiring HTTP
  # Basic Auth (an unauthenticated request gets 401 and the export exits 3).
  # Supply both or neither. Resolved cluster-side from the credential store;
  # CLI --proxy-basic-user/--proxy-basic-pass or env DBX_PROXY_BASIC_USER/PASS
  # take precedence when set. Add both to assert_present for deployments whose
  # proxy requires auth, so a missing credential fails at startup instead of
  # 401-ing mid-export.
  # dbx_proxy_basic_user:
  #   from: aidp_credential_store
  #   name: <credential-name-in-aidp>       # e.g. dbx_proxy_credential
  #   key:  <key-name-inside-credential>    # e.g. dbx-proxy-basic-user
  # dbx_proxy_basic_pass:
  #   from: aidp_credential_store
  #   name: <credential-name-in-aidp>       # e.g. dbx_proxy_credential
  #   key:  <key-name-inside-credential>    # e.g. dbx-proxy-basic-pass


# ─── REQUIRED — Write-redirect sandbox ──────────────────────────────────────
# Consumed by scripts/job_migrate.py's write-redirect feature: while a
# migrated notebook runs during validation, recognized table writes and
# direct Spark writer OCI paths are redirected to this sandbox. If this
# section is absent, the feature is DISABLED cleanly. If present, ALL three
# fields are required (schema enforces).
# This is not a universal I/O firewall: dynamic spark.sql DML, writer aliases,
# writeStream and arbitrary SDK calls are outside the runtime path guard.
# Already-redirected paths must match BOTH bucket and namespace exactly;
# table idempotency uses the configured catalog.schema table_prefix.
# Direct Python dbutils.fs consumers of registered Spark outputs follow the
# same sandbox paths, including later cells. put/mkdirs/copy destinations are
# redirected too. Direct Python Spark path reads resolve against executed
# producers, never a merely discovered later write; table literals are
# substituted in statement order. Comments/source-example strings are not
# writers. Ordinary customer JSON output is not a platform text envelope.
# Customer paths are retained in saved source. Cleanup slash
# semantics are NOT changed: a shim failure must be repaired in saved source
# or reported unresolved. Untracked OCI cleanup/move and known OCI directory
# copy/move fail as REDIRECT_REFUSED without model repair (including clean-
# before-write). Aliases, arbitrary SDK calls, and ancestor-directory reads
# are outside this direct-call mapping; this is not a universal I/O sandbox.
#
# For a new customer: create a dedicated bucket + schema for the sandbox.
# The tool CREATE-SCHEMA-IF-NOT-EXISTS on the sandbox schema at startup
# (see _ensure_redirect_schema in job_migrate.py).
#
# redirect:
#   bucket: <sandbox-bucket>
#   namespace: <oci-namespace>
#   table_prefix: default.<sandbox_table_prefix>


# ─── Spark config baked into every new AIDP cluster (REQUIRED) ──────────────
# These Spark configs are baked into every AIDP cluster this tool creates.
# The DBX source cluster's spark_conf overlays on top (customer's original
# tuning preserved), with a light auto-heal for malformed values. Any key
# you want on the new cluster MUST appear here.
#
# Merge policy in dbx_export/cluster_converter.py::convert_dbx_cluster:
#   1. spark_config baseline (this block)  →  fill in every key
#   2. DBX source cluster's spark_conf     →  overlay (customer's original tuning)
#      - if value is malformed for the expected type, auto-heal or fall back
#        to this block's default (recorded in log for the operator to see)
#
# Edit any value in place. Delete a key to opt out of that default.
#
# NOTE: Kryo serialization is ENABLED by default (spark.serializer below) for its
# performance win. History/caveat: ONE migrated the pilot deployment job (not all Hudi tables) hit,
# on executors during a cross-tenancy Hudi (oci://) partition listing:
#     KryoException: Unable to find class
#     org.apache.hudi.hadoop.fs.HoodieSerializableFileStatus
# i.e. Kryo's class resolver could not load the Hudi class from the cluster-added
# (user-jar) Hudi bundle on the executor. This was isolated to ONE job across many,
# and Kryo's speedup is significant, so Kryo stays ON by default.
#
# IMPORTANT: spark.serializer is a STATIC Spark conf — read once at SparkContext
# creation, it CANNOT be changed in a live session. So a recurrence is NOT fixable
# at runtime (not by the migrator's fix loop, not in-cell). The remediation is a
# cluster-config change: recreate the cluster with spark.kryoserializer.buffer.max
# + the Hudi Kryo registrar, or drop back to Java serialization. Those two keys are
# NOT shipped here — they are unproven against the pilot deployment's (not fully open-source) Hudi
# build, so add them only after testing IF a recurrence actually occurs:
#   spark.kryoserializer.buffer.max: 512m
#   spark.kryo.registrator: org.apache.spark.HoodieSparkKryoRegistrar  # Hudi's Kryo registrar
# Being static, this key is applied to NEWLY created clusters only; the migration
# pre-flight does not advise adding it to existing, working clusters.

spark_config:
  spark.serializer:                                        "org.apache.spark.serializer.KryoSerializer"
  spark.sql.execution.arrow.pyspark.enabled:               "true"
  spark.sql.execution.arrow.pyspark.fallback.enabled:      "true"
  spark.sql.execution.arrow.maxRecordsPerBatch:            "50000"
  spark.executor.memoryOverheadFactor:                     "0.2"
  spark.driver.memoryOverheadFactor:                       "0.2"
  spark.sql.shuffle.partitions:                            "2048"
  spark.sql.files.maxPartitionBytes:                       "512m"

  # Tolerate files removed/corrupted between listing and read. Two causes seen
  # on live the pilot deployment tables: (1) a concurrent Hudi compaction deleting a parquet
  # file that was in the scan plan (SparkFileNotFoundException); (2) the
  # customer's downstream applications rewriting/replacing table files while a
  # read is in flight. In use across all the pilot deployment migration jobs for ~2 months.
  # NOTE: ignoreCorruptFiles silently skips genuinely-corrupt files (no
  # error). Default FALSE: set "true" only if your data owner accepts that
  # trade-off (some source lakes carry known-corrupt stragglers); do NOT
  # treat a short row count as a clean read without checking cluster logs for
  # skipped-file WARNs.
  spark.sql.files.ignoreMissingFiles:                      "false"
  spark.sql.files.ignoreCorruptFiles:                      "false"

  spark.sql.adaptive.advisoryPartitionSizeInBytes:         "64m"
  spark.sql.adaptive.coalescePartitions.minPartitionSize:  "8m"
  spark.sql.autoBroadcastJoinThreshold:                    "200m"
  spark.sql.parquet.enableVectorizedReader:                "true"
  spark.sql.manifest.file.commit.protocol.enabled:         "true"

  # OCI object-store read tuning — reduces small-request storms on wide parquet
  # scans and enables client-side jersey / parquet metadata caching.
  spark.hadoop.fs.oci.io.read.ahead:                       "true"
  spark.hadoop.fs.oci.io.read.ahead.blocksize:             "33554432"
  spark.hadoop.fs.oci.io.read.ahead.blockcount:            "16"
  spark.hadoop.fs.oci.io.read.ahead.numthreads:            "48"
  spark.hadoop.fs.oci.client.jersey.default.connector.enabled: "true"
  spark.hadoop.fs.oci.caching.object.parquet.enabled:      "true"
  spark.hadoop.fs.oci.caching.object.metadata.enabled:     "true"


# ─── Aggressive-autoscale defaults (REQUIRED) ───────────────────────────────
# AIDP-specific keys (never present on a source DBX cluster) that make executors
# scale up on backlog quickly and release idle ones. These are merged into
# spark_conf via the same policy as spark_config above.
#
# Delete this whole block (leave it as `autoscale_config: {}`) to opt out of
# aggressive autoscale and let AIDP's platform defaults apply.

autoscale_config:
  spark.aidp.compute.autoscale.schedulerBacklogTimeoutSeconds:          "1"
  spark.aidp.compute.autoscale.sustainedSchedulerBacklogTimeoutSeconds: "1"
  spark.aidp.compute.autoscale.allocation.batchDelayMillis:             "1000"
  spark.aidp.compute.autoscale.allocation.batchSize:                    "10"
  spark.aidp.compute.autoscale.allocation.maxPendingPods:               "60"
  spark.aidp.compute.autoscale.executorIdleTimeoutSeconds:              "600"


# ─── Runtime tunables (REQUIRED) ────────────────────────────────────────────
# Per-run knobs for the migrator itself. Bounds are schema-enforced
# (out-of-range fails load).

runtime:
  cell_execute_timeout_s: 14400   # per-cell execute timeout (60–86400 seconds)
  fix_max_attempts: 5             # Opus fix attempts per cell (1–50); ~85% of fixable cells resolve in ≤2 attempts, >4 rarely helps
  ws_recycle_interval_s: 300      # WebSocket recycle interval (30–3600 seconds)
  phase1_max_parallel_clusters: 3 # distinct clusters prepared concurrently; work within each cluster remains serial
  readiness_report_max_age_s: 1800 # reuse window measured from Phase-1 completion
  # readiness_report_path: /Workspace/path/to/readiness.json  # optional Phase-1 report consumed by Phase 2


# ─── OPTIONAL — Migration-time cluster policy ──────────────────────────────
# The migrator temporarily raises each task cluster's idle auto-termination to
# cluster_idle_timeout_minutes while it is actively migrating on that cluster,
# then restores the cluster's ORIGINAL value when it moves off it and at job end.
# This stops a cluster from idle-terminating mid-task during long setup/think
# gaps (which surfaces as unrelated errors) without permanently raising its cost
# profile. Best-effort: a bump/restore that can't be confirmed is logged loudly
# but never fails the migration. Only clusters whose current timeout is BELOW
# this value are raised; restore is always to the recorded original. Range
# 15–44640 minutes. Shown here at the built-in default (30) so it can be tuned
# without a code change; remove the block to fall back to the same default.
migration:
  cluster_idle_timeout_minutes: 30


# ─── REQUIRED — LLM provider / model ───────────────────────────────────────
# Which model the migration engine uses. `provider` + `model` are the ONLY llm
# config keys, and both are REQUIRED here (no code default — an absent/partial `llm`
# block fails loudly), so the model is always explicit and swapping it needs NO code
# change.
#   provider:  only "anthropic" is dispatched today; other values are rejected.
#   model:     restricted to the validated Opus-5 family — "claude-opus-5" or
#              "claude-opus-5-5" (switch between them freely; any other value is
#              rejected at load).
# thinking (adaptive) and output budget (16000) are FIXED internal constants, NOT
# config knobs: on the Opus-5 family "thinking: off" cannot disable adaptive thinking
# and max_tokens is not a true per-request cap, so they are not exposed (the schema
# rejects them). Re-adding those knobs, another model, or another provider is a
# code+schema+test change, not a YAML edit. See scripts/llm_config.py.
llm:
  provider: anthropic
  model: claude-opus-5-5


# ─── OPTIONAL — Per-customer "must be set" assertions ──────────────────────
#
# TWO layers of "required" exist. Do NOT confuse them:
#
#   1. SCHEMA-LEVEL REQUIRED  (in aidp_config/schema.json — tool code)
#      Applies to EVERY customer. Enforces that the top-level sections
#      (aidp, paths, bucket_mapping, dbx_source, secrets) and their infra
#      sub-fields are present. Missing = load fails, no matter who you are.
#      → You do NOT list these here. They are already enforced.
#
#   2. PER-CUSTOMER `assert_present`  (this block, in YOUR YAML)
#      Applies ONLY to YOUR deployment. Lists OPTIONAL config fields that
#      YOUR setup positively depends on. If any listed field is absent /
#      empty when the tool starts, load fails immediately.
#      → List entries here to opt-in to fail-loud for optional features.
#
# When to add an entry to `assert_present`:
#   - You use MLflow → list `secrets.mlflow_tracking_uri` so a missing URI
#     doesn't silently no-op every experiment call.
#   - You use the write-redirect sandbox → list all of `redirect.bucket`,
#     `redirect.namespace`, `redirect.table_prefix` so a partially-configured
#     block doesn't disable redirect and let writes hit production.
#
# When NOT to add an entry:
#   - The field is already schema-required (see list above). Redundant.
#   - You don't use the feature. Just omit the field from your YAML.
#
# assert_present:
#   - secrets.mlflow_tracking_uri     # opt-in: fail if MLflow URI absent
#   - secrets.entity_crypto_arn              # opt-in: fail if entity-crypto ARN absent
#   - redirect.bucket                 # opt-in: fail if redirect not configured
#   - redirect.namespace
#   - redirect.table_prefix


# ============================================================================
#  ENVIRONMENT OVERRIDES (highest precedence apart from CLI flags)
# ============================================================================
# Any of these env vars, if set to a non-empty value, override the
# corresponding YAML field. Useful for CI / secrets injection / per-invocation
# swap without editing this file.
#
#    AIDP_LAKE_OCID       -> aidp.lake_ocid
#    AIDP_WORKSPACE_ID    -> aidp.workspace_id
#    AIDP_REGION          -> aidp.region
#    AIDP_OCI_PROFILE     -> aidp.oci_profile
#    AIDP_MIGRATE_OUTPUT  -> paths.migrate_output
#    AIDP_EXPORT_OUTPUT   -> paths.export_output
#    AIDP_TARGET_RUNTIME_REQUIREMENTS_FILE -> paths.target_runtime_requirements_file
#    AIDP_COMPATIBILITY_POLICY_FILE -> paths.compatibility_policy_file
#    AIDP_READINESS_REPORT -> runtime.readiness_report_path
#    AIDP_MLFLOW_URI      -> secrets.mlflow_tracking_uri
#    AIDP_ENTITY_CRYPTO_ARN      -> secrets.entity_crypto_arn
#    AIDP_DBX_HOST        -> dbx_source.host
#    AIDP_DBX_PROXY       -> dbx_source.proxy
#    AIDP_ALLOW_SHARED_CLUSTER_RESTART -> opt in to restarting an ACTIVE target
#                                          after libraries queue INSTALL_ON_RESTART
# ============================================================================
