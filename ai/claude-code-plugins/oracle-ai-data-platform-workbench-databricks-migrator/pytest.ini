[pytest]
# Scope collection to THIS plugin's tests.
#
# `pytest` from the plugin root collects only engine/tests; `engine/` is the
# package root (aidp_compat, dbx_export, aidp_config) and engine/scripts is
# importable directly (job_migrate, agent_migrate, …) to match the tests'
# `sys.path.insert(.., "../scripts")` convention.
testpaths = engine/tests
pythonpath = engine engine/scripts
