reconciliations:
  - name: "AR Transaction Fact validation"
    type: all
    source:
      type: oracle
      host: ebs-prod.example.com
      port: 1521
      database: EBSPROD
      schema: AR
      table: INVOICE_TXN
      username: "${SOURCE_DB_USER}"
      password: "${SOURCE_DB_PASS}"
    target:
      catalog: main
      schema: warehouse
      table: FCT_AR_TRANSACTIONS
    key_columns: [CUSTOMER_TRX_ID]
    # Audit/surrogate columns never match between source and target -
    # excluding them prevents false reconciliation failures. See spec section 21 item 24.
    ignore_columns: [LOAD_ID, LOAD_TS, UPDATE_TS, SURROGATE_KEY]
    tolerance: 0.01
  - name: "Customer Dimension validation"
    type: row_count
    source:
      type: oracle
      host: ebs-prod.example.com
      port: 1521
      database: EBSPROD
      schema: AR
      table: PARTY_MASTER
    target:
      catalog: main
      schema: warehouse
      table: DIM_CUSTOMER
