[pytest]
# Scope collection to THIS plugin's tests.
#
# The plugin lives in a shared samples monorepo alongside other teams'
# samples, and some of those carry `test_*.py` files that are scripts rather
# than pytest modules -- one of them calls sys.exit(1) at import time, which
# takes pytest down with an INTERNALERROR during collection. Running pytest
# from the repo root therefore fails for reasons that have nothing to do with
# this plugin.
#
# The fix is to scope, not to delete: those samples belong to other people.
# With this file, `pytest` from the plugin root collects only engine/tests.
testpaths = engine/tests
# engine/ is importable as the package root; engine/tests too, so the shared
# doubles (fake_sql) import as top-level modules.
pythonpath = engine engine/tests
