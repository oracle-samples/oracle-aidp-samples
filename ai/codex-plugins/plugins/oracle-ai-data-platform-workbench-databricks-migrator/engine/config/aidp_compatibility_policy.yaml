# AIDP workload-cluster Python compatibility policy.
#
# This file is applied while each cluster's single consolidated requirements
# file is generated. Package names follow PEP 503 normalization, so underscores
# and hyphens are equivalent.
schema_version: 1

# These versions are required by the AIDP notebook/kernel runtime. They replace
# workload-provided pins so an exported dependency cannot break kernel-to-driver
# communication.
protected_packages:
  typing-extensions: "==4.16.0"
  # pandas/numpy: the migration profile installs these exact versions
  # (config/default_requirements.txt — PyArrow/.toPandas() compatibility;
  # numpy shadowing broke kernels in the manual-pip _ARRAY_API incident).
  # A workload pin never changes them: it is REPLACED and reported in the
  # consolidated file's header. Note this supersedes the flexibility the
  # target_runtime_requirements.txt ranges allowed pip — if a workload
  # package genuinely requires a different numpy/pandas, the single-
  # transaction pip resolve fails visibly and this policy gets a reviewed
  # rule (operator decision 2026-09-09: installed versions must not change).
  numpy: "==1.26.4"
  pandas: "==2.2.3"
  # Ray must stay identical across the notebook driver, head, and workers.
  # Replace workload pins/extras so the generated requirement is deterministic.
  ray: "==2.55.0"

# Packages the AIDP runtime ships with PLATFORM INTEGRATION. Every workload
# pin — including conflicting pins across sources (the export-blocking
# two-version incident, 2026-09-09) — collapses to the bare package name, so
# pip judges the runtime's integrated version satisfied and leaves it alone.
# Installing a pinned version over a runtime-integrated package shadows the
# platform copy (the manual-pip numpy _ARRAY_API incident class). Keep this
# list NARROW and explicit: unlisted packages keep customer pins verbatim
# (e.g. xgboost — the model file requires the exact training version).
# SUPERSEDING DECISION (2026-09-16, PR #109): unlisted packages with CONFLICTING
# exact pins are consolidated highest-wins (never block cluster creation; the
# collapse is recorded in the export report as requirements-conflict). This
# reverses the earlier 2026-09-09 (#88) "unlisted conflicting pins fail loudly"
# decision, which blocked multi-task per_task jobs on a duplicated read. An
# exact pin that a co-asserted range/exclusion forbids is KEPT (pin-override,
# reported). Only unsatisfiable PURE-range combinations (no pin to override
# with), conflicting pins across overlapping markers, and conflicting === pins
# still fail loudly.
# NOTE: pandas/numpy do NOT belong here — they are deliberately constrained
# by config/default_requirements.txt + config/target_runtime_requirements.txt
# (PyArrow/.toPandas() compatibility profile).
runtime_provided_packages:
  - mlflow

# Conservative export-time import audit. Only these reviewed mappings may
# create a workload requirement; every other third-party import is reported.
# Keep version pins here only when backed by a target-runtime compatibility
# contract. These mappings are intentionally unpinned otherwise.
import_to_distribution:
  # The protected-package rule above supplies Ray 2.55 and replaces any
  # conflicting source pin or extras declaration.
  ray: ray
  matplotlib: matplotlib
  seaborn: seaborn
  PIL:
    requirement: Pillow
    # pillow-simd supplies the same PIL namespace and must take precedence when
    # the customer selected it explicitly.
    aliases:
      - pillow-simd
  sklearn: scikit-learn
  dateutil: python-dateutil
  joblib: joblib
  pytz: pytz
  cv2:
    requirement: opencv-python
    # OpenCV explicitly requires one provider variant per environment.
    aliases:
      - opencv-python-headless
      - opencv-contrib-python
      - opencv-contrib-python-headless
  yaml: PyYAML
  bs4: beautifulsoup4
  attr: attrs

# Python roots already supplied by AIDP, Spark, or the migration runtime.
# runtime_provided_packages above is also folded into this set by the audit.
provided_imports:
  - IPython
  - aidp_compat
  - aidp_dbutils
  - aidputils
  - dbutils
  - nbformat
  - oci
  - oidlUtils
  - py4j
  - pyspark
  - spark

# Scala/Java import roots can appear in default-language notebook cells. They
# are JVM namespaces, never Python distributions.
jvm_roots:
  - com
  - io
  - java
  - javax
  - net
  - org
  - scala

