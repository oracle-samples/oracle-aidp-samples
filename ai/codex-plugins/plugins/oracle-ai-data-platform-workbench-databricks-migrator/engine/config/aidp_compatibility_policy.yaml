# Conditional, reviewed rewrites for known source-to-target incompatibilities.
# A VERSIONED `when` condition fires only when every listed package has an
# exact discovered pin satisfying the configured specifier. An EMPTY condition
# (`when: {package: ""}`) is presence-match — any discovered form, including
# unpinned — reserved for packages uninstallable from the index at EVERY
# version (see _condition_matches in dbx_export/requirements.py). All listed
# `requirements` then replace the source constraints in the consolidated file.
rules:
  - id: tensorflow-2.13-typing-extensions-aidp-runtime
    when:
      tensorflow: "==2.13.*"
    requirements:
      tensorflow: "==2.14.1"
      typing-extensions: "==4.16.0"
    reason: >-
      TensorFlow 2.13 requires typing-extensions<4.6, which conflicts with the
      AIDP kernel runtime. TensorFlow 2.14.1 removes that upper bound.
  - id: tensorflow-2.12-numpy-1.26-aidp-runtime
    when:
      tensorflow: "==2.12.*"
    requirements:
      tensorflow: "==2.15.0"
      # keras is pinned in lockstep with the TF bump. If a source pins tensorflow
      # behind an environment marker but omits keras, the injected keras INHERITS
      # that marker (one keras line per marker when tensorflow is pinned under
      # several), so keras installs exactly where — and only where — tensorflow
      # does. AIDP is a MIXED fleet (ARM/AMD/Intel/GPU), so an unconditional
      # injection could land keras on a node with no matching tensorflow; marker
      # propagation avoids that. Absent-package injection is under the trigger's
      # marker(s); see _replace_policy_requirement in dbx_export/requirements.py.
      keras: "==2.15.0"
    reason: >-
      TensorFlow 2.12 caps numpy<1.24, which conflicts with the protected
      numpy==1.26.4 above — the single-transaction pip resolve fails
      ResolutionImpossible ("numpy==1.26.4 and tensorflow ... conflicting
      dependencies"; observed 2026-09 at cluster readiness, live-reproduced
      in ~7s). TF 2.15 accepts numpy>=1.23.5,<2.0 (1.26.4 satisfies) and —
      critically — stays on the Keras-2 API (keras 2.15). We pin keras in
      lockstep and never bump to TF 2.16+, which would force Keras 3 (a breaking
      runtime API change for exported Keras-2 notebook code, invisible to a
      resolution check).
  - id: flash-attn-prebuilt-wheel-torch-2.5-cu12-cp311-glibc214
    when:
      flash-attn: ""
    requirements:
      torch: "==2.5.1"
      flash-attn: "@ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl"
    reason: >-
      flash-attn publishes prebuilt wheels ONLY on GitHub releases; PyPI (and
      an internal package mirror) carry sdists whose build imports torch — which is
      never present in the isolated cluster-library install env, so EVERY
      index-resolved install fails (LibraryTaskException with an empty message;
      incident job STANDALONE_GENERIC_E2E 1000000000061_84953597, reproduced
      live 2026-10-05 on an A10/py3.11 cluster: unpinned, torch==2.5.0,
      torch==2.5.1, and flash-attn==2.7.3 all FAILED; torch alone INSTALLED).
      The fix pins torch==2.5.1 and installs flash-attn from the matching
      cu12torch2.5/cxx11abiFALSE/cp311 GitHub wheel directly. torch 2.8.0 +
      the newest wheel line (v2.8.3) was tried FIRST and REJECTED: it
      INSTALLED but failed to import — every v2.8.3 wheel requires
      GLIBC_2.32 (objdump-verified), which the cluster runtime does not
      provide; the 2.7.4.post1 cu12torch2.5 wheel needs only GLIBC_2.14.
      The shipped pair INSTALLED through the real dfcs installer (408s) and
      passed a kernel flash-attn op (fp16, A10); the full 25-package
      consolidated file co-resolved and INSTALLED in one transaction (516s).
      Wheel tags must match the GPU runtime — and the glibc requirement is
      NOT carried in the wheel tag: revalidate when the runtime's
      Python/CUDA/glibc changes [verified: 2026-10, py3.11/cu12.4/A10,
      glibc<2.32].
