aidp:
  region: ap-mumbai-1
  lake_ocid: ocid1.aidataplatform.oc1.ap-mumbai-1.abc123
  workspace_id: 00000000-0000-4000-8000-000000000001
  oci_profile: DEFAULT
  default_namespace: xxns
paths:
  migrate_output: /Workspace/test/output
  export_output: /Workspace/test/target
bucket_mapping:
  path: mapping.json
dbx_source:
  host: https://x.cloud.databricks.com
secrets:
  mlflow_tracking_uri: https://user:pass@mlflow
  entity_crypto_arn: arn:aws:sts::123:assumed-role/x
  entity_crypto_registrar: com.example.dp.UdfRegistrar
redirect:
  bucket:       sandbox_bucket
  namespace:    sandboxns
  table_prefix: default.sandbox_overwrite
assert_present:
  - secrets.mlflow_tracking_uri
  - secrets.entity_crypto_arn
  - redirect.bucket
  - redirect.namespace
  - redirect.table_prefix
spark_config: {}
autoscale_config: {}
runtime:
  cell_execute_timeout_s: 14400
  fix_max_attempts: 5
  ws_recycle_interval_s: 300
