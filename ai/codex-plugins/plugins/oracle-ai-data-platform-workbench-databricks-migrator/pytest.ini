[pytest]
# Scope collection to THIS plugin's tests.
#
# engine/scripts carries `test_jar_functionality.py`, a cluster-side script
# (not a pytest module) that imports the live AIDP executor at import time;
# collecting it from the plugin root would fail for reasons unrelated to the
# unit tests. With this file, `pytest` from the plugin root collects only
# engine/tests, and `engine/` is importable as the package root.
testpaths = engine/tests
pythonpath = engine
